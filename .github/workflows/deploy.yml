name: Build & Publish Mobile App

on:
  push:
    branches:
#      - dev
      - uat
      - prod

permissions:
  contents: write

concurrency:
  group: mobile-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  determine-version:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}

    outputs:
      version: ${{ steps.bump_version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get current version from the latest git tag
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          git fetch origin 'refs/tags/*:refs/tags/*'

          TAG=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)

          if [ -z "$TAG" ]; then
            TAG="v0.0.0"
          fi

          # Remove leading "v" for calculations
          TAG=${TAG#v}

          echo "TAG=$TAG"
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Bump version
        id: bump_version
        run: |
          IFS='.' read -r -a VERSION_PARTS <<< "$TAG"

          MAJOR="${VERSION_PARTS[0]}"
          MINOR="${VERSION_PARTS[1]}"
          PATCH="${VERSION_PARTS[2]}"

          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}

          while git tag -l "v$MAJOR.$MINOR.$PATCH" | grep -q .; do
            if [ "$GITHUB_REF_NAME" = "dev" ]; then
              PATCH=$((PATCH + 1))
            fi

            if [ "$GITHUB_REF_NAME" = "uat" ]; then
              MINOR=$((MINOR + 1))
              PATCH=0
            fi

            if [ "$GITHUB_REF_NAME" = "prod" ]; then
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
            fi

          done

          VERSION="$MAJOR.$MINOR.$PATCH"

          echo "Generated version: v$VERSION"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create and push release tag
        env:
          VERSION: ${{ steps.bump_version.outputs.version }}
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git

          git tag -a "v$VERSION" -m "Release v$VERSION"

          git push origin "v$VERSION"

  build-and-publish:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    needs: determine-version

    env:
      VERSION: ${{ needs.determine-version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate environment files
        run: dart run env/generate.dart

      - name: Create .env
        run: |
          cp ".env.${{ github.ref_name }}" .env
          cat .env

      #      - name: Verify .env
      #        run: |
      #          echo "Created .env:"
      #          cat .env

      - name: Install dependencies
        run: flutter pub get

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks

      #      - name: Debug keystore
      #        run: |
      #          ls -la android
      #          ls -la android/app
      #          cat android/app/upload-keystore.jks
      #
      #      - name: Check keystore
      #        run: |
      #          ls -lh android/app/upload-keystore.jks
      #          file android/app/upload-keystore.jks

      - name: Create google-services.json
        run: |
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Checkout proto repository
        uses: actions/checkout@v4
        with:
          repository: beartrando/tic-tac-toe-proto
          ref: master
          path: infra/proto
          token: ${{ secrets.GH_PAT }}

      - name: Generate protobuf files
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          dart pub global activate protoc_plugin 25.0.0
          mkdir -p lib/contracts/proto/
          protoc \
            --dart_out=grpc:lib/contracts/proto \
            --proto_path=infra/proto \
            $(find infra/proto -name "*.proto")

      - name: Create Google Play credentials
        run: |
          cat > google-play.json <<'EOF'
          ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          EOF

      - name: Build appbundle
        run: |
          flutter build appbundle \
            --release \
            --build-name=$VERSION \
            --dart-define=APP_VERSION=$VERSION \
            --dart-define=GIT_SHA=$GITHUB_SHA \
            --build-number=$GITHUB_RUN_NUMBER

      - name: Upload to Google Play (internal)
        if: github.ref_name != 'prod'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: google-play.json
          packageName: org.beartrando.tictactoe
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          tracks: internal
          whatsNewDirectory: ./release-notes

      - name: Upload to Google Play (production)
        if: github.ref_name == 'prod'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          packageName: org.beartrando.tictactoe
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          tracks: production
          whatsNewDirectory: ./release-notes

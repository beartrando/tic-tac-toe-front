name: front
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 0.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.2
  flutter_dotenv: ^6.0.0
  device_info_plus: ^12.4.0
  flutter_secure_storage: ^10.3.1
  intl: ^0.20.2
  jwt_decode: ^0.3.1
  uuid: ^4.0.0
  provider: ^6.1.0
  flutter_riverpod: ^2.4.0
  logger: ^2.0.2
  web_socket_channel: ^3.0.3
  fixnum: ^1.1.0
  in_app_update: ^4.2.5
  http: ^1.0.0
  protobuf: ^6.1.0
  firebase_core: ^4.15.0
  firebase_crashlytics: ^5.4.0
  firebase_analytics: ^12.6.0
  audioplayers: ^6.7.1


dev_dependencies:
  flutter_test:
    sdk: flutter

  protoc_plugin: ^25.0.0
  flutter_lints: ^6.0.0
  intl_utils: ^2.8.2
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:

  uses-material-design: true
  assets:
    - .env
    - assets/audio/music/background.mp3
    - assets/audio/effects/win.wav
    - assets/audio/effects/lose.wav
    - assets/audio/effects/move.wav
    - assets/audio/effects/reject-move.wav

flutter_intl:
  enabled: true
  arb_dir: lib/infrastructure/localization/translations
  output_dir: lib/infrastructure/localization/generated

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#101e2d"
  #  adaptive_icon_background: "#FFC0CB"
  adaptive_icon_foreground: assets/icon/icon.png

flutter_native_splash:
  color: "#000000"
  image: assets/icon/beartrando_logo.png

  android: true
  ios: false

  android_12:
    color: "#000000"
    image: assets/icon/beartrando_logo.png

